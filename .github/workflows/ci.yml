name: Shade CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Ubuntu runners already include Android SDK/cmdline tools. Avoid
      # setup-android here because it tries to install the removed `tools`
      # SDK package on newer runner images.
      - name: Grant wrapper permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug
