name: Shade CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Ubuntu runners already include the Android SDK/cmdline tools; just make sure
      # the platform we compile against is installed. Fail loudly if it isn't —
      # silently continuing produced confusing Gradle errors later.
      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          sdkmanager_install() {
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$1" "build-tools;37.0.0" > /dev/null 2>&1
          }
          if ! sdkmanager_install "platforms;android-37"; then
            sdkmanager_install "platforms;android-37.0" || {
              echo "::error::Unable to install platforms;android-37 (neither naming variant available)"
              exit 1
            }
            if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
              ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
            fi
          fi

      - uses: gradle/actions/setup-gradle@v5

      # Robolectric downloads android-all jars from Maven Central at test time.
      # Cache them so repeated runs skip the network entirely and a transient
      # Maven hiccup can't fail the whole job.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: |
            ~/.robolectric
            ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-4.16.1

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Single run: the old "|| retry" masked flaky tests as green passes.
      # Flaky tests should be annotated (@Retry) or fixed, not hidden.
      - name: Unit tests
        run: ./gradlew test --stacktrace

      # Logs need sign-in; artifacts are public. This names the exact failing
      # test + stack trace on any red run.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # The minified + resource-shrunk release build must succeed as a BLOCKING
      # step: R8 breakage is a release blocker, never a warning. Without
      # keystore.properties the signing config falls back to the debug
      # keystore, so the artifact is still installable and inspectable.
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shade-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: shade-release
          path: app/build/outputs/apk/release/*.apk
