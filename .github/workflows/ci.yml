name: Shade CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Ubuntu runners already include the Android SDK/cmdline tools; just make sure
      # the platform we compile against is installed.
      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" "build-tools;37.0.0" > /dev/null || \
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - uses: gradle/actions/setup-gradle@v5

      # Robolectric downloads android-all jars from Maven Central at test time.
      # Cache them so repeated runs skip the network entirely and a transient
      # Maven hiccup can't fail the whole job.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: |
            ~/.robolectric
            ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-4.16.1

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --stacktrace || ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # The minified + resource-shrunk release build must succeed as a BLOCKING
      # step: R8 breakage is a release blocker, never a warning. Without
      # keystore.properties the signing config falls back to the debug
      # keystore, so the artifact is still installable and inspectable.
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shade-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: shade-release
          path: app/build/outputs/apk/release/*.apk
